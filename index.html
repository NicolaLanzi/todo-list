<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TaskFlow: una todo list semplice e completa per organizzare le tue giornate."
    />
    <meta name="theme-color" content="#f4f2ee" />
    <title>TaskFlow · Todo list</title>
    <script>
      // Applica il tema prima del primo paint per evitare flash.
      ;(() => {
        try {
          const raw = localStorage.getItem('taskflow.v1')
          const saved = raw ? JSON.parse(raw) : null
          const pref = saved && saved.prefs && saved.prefs.theme
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme =
            pref === 'light' || pref === 'dark' ? pref : systemDark ? 'dark' : 'light'
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <a class="skip-link" href="#new-title">Vai al campo attività</a>

    <div id="app" class="app">
      <header class="app-header">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="m5 12.5 4.2 4.2L19 7" />
            </svg>
          </div>
          <div class="brand-text">
            <h1>TaskFlow</h1>
          </div>
        </div>
        <button id="theme-toggle" class="icon-btn theme-toggle" type="button" aria-label="Cambia tema">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
          </svg>
        </button>
      </header>

      <main class="app-main">
        <section class="card composer" aria-labelledby="composer-title">
          <h2 id="composer-title" class="sr-only">Aggiungi una nuova attività</h2>
          <form id="add-form" novalidate>
            <div class="composer-main">
              <label class="sr-only" for="new-title">Cosa devi fare?</label>
              <input
                id="new-title"
                class="text-input composer-input"
                type="text"
                placeholder="Cosa vuoi portare a termine?"
                maxlength="160"
                autocomplete="off"
              />
              <button class="btn btn-primary" type="submit">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                  <path d="M12 5v14M5 12h14" />
                </svg>
                <span>Aggiungi</span>
              </button>
            </div>

            <div class="composer-options">
              <label class="field">
                <span class="field-label">Priorità</span>
                <select id="new-priority" class="select">
                  <option value="high">Alta</option>
                  <option value="medium" selected>Media</option>
                  <option value="low">Bassa</option>
                </select>
              </label>
              <label class="field">
                <span class="field-label">Scadenza</span>
                <input id="new-due" class="text-input" type="date" />
              </label>
              <label class="field field-category">
                <span class="field-label">Categoria</span>
                <input
                  id="new-category"
                  class="text-input"
                  type="text"
                  list="category-options"
                  placeholder="Generale"
                  maxlength="24"
                  autocomplete="off"
                />
              </label>
            </div>

            <p id="form-error" class="form-error" role="alert" hidden></p>
          </form>
        </section>

        <section class="card toolbar" aria-label="Filtri e ricerca">
          <div class="toolbar-row">
            <div class="search">
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-3.5-3.5" />
              </svg>
              <label class="sr-only" for="search">Cerca tra le attività</label>
              <input id="search" class="text-input search-input" type="search" placeholder="Cerca… (premi /)" autocomplete="off" />
              <button id="search-clear" class="search-clear" type="button" aria-label="Cancella ricerca" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                  <path d="M18 6 6 18M6 6l12 12" />
                </svg>
              </button>
            </div>

            <div class="filters" role="group" aria-label="Filtra le attività">
              <button type="button" class="filter-btn" data-filter="all" aria-pressed="true">
                Tutte <span class="filter-count" data-count="all">0</span>
              </button>
              <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">
                Attive <span class="filter-count" data-count="active">0</span>
              </button>
              <button type="button" class="filter-btn" data-filter="completed" aria-pressed="false">
                Completate <span class="filter-count" data-count="completed">0</span>
              </button>
            </div>
          </div>

          <div class="toolbar-row toolbar-row-secondary">
            <div id="category-filters" class="category-filters" role="group" aria-label="Filtra per categoria"></div>
            <label class="sort">
              <span>Ordina</span>
              <select id="sort" class="select select-sm">
                <option value="manual">Manuale</option>
                <option value="recent">Più recenti</option>
                <option value="priority">Priorità</option>
                <option value="due">Scadenza</option>
                <option value="alpha">Alfabetico</option>
              </select>
            </label>
          </div>
        </section>

        <section class="list-section" aria-labelledby="list-heading">
          <div class="list-head">
            <h2 id="list-heading">
              Le tue attività
              <span id="visible-count" class="count-badge">0</span>
            </h2>
            <button id="toggle-all" type="button" class="link-btn">Segna tutte come completate</button>
          </div>

          <ul id="todo-list" class="todo-list"></ul>

          <div id="empty-state" class="empty-state" hidden>
            <div class="empty-illustration" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 7h16M4 12h10M4 17h6" />
                <circle cx="17.5" cy="16.5" r="4" />
                <path d="m16 16.5 1.2 1.2 2.2-2.4" />
              </svg>
            </div>
            <h3 id="empty-title">Nessuna attività</h3>
            <p id="empty-text">Aggiungi la tua prima attività per iniziare.</p>
            <button id="empty-action" type="button" class="btn btn-ghost" hidden>Azzera i filtri</button>
          </div>
        </section>
      </main>

      <footer class="card app-footer">
        <div class="footer-stats">
          <span id="stats-left" aria-live="polite">Nessuna attività</span>
          <div id="progress" class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Completamento attività">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
          <span id="progress-label">0%</span>
        </div>
        <div class="footer-actions">
          <span
            id="save-status"
            class="save-status"
            title="Le attività sono salvate automaticamente in questo browser e restano anche dopo la chiusura del server."
          >
            <span class="save-dot" aria-hidden="true"></span>
            <span id="save-status-text">Salvato in locale</span>
          </span>
          <p class="hint"><kbd>N</kbd> nuova <span aria-hidden="true">·</span> <kbd>/</kbd> cerca</p>
          <button id="clear-completed" type="button" class="btn btn-ghost btn-sm">Cancella completate</button>
        </div>
      </footer>
    </div>

    <datalist id="category-options"></datalist>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden>
      <span id="toast-message"></span>
      <button id="toast-action" type="button" class="toast-action" hidden>Annulla</button>
      <button id="toast-close" type="button" class="toast-close" aria-label="Chiudi notifica">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
